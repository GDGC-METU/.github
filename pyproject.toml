[project]
name = "waste-sorter"
version = "0.1.0"
description = "Laptop vision and Arduino Uno R3 waste sorting prototype"
requires-python = ">=3.10"
dependencies = ["opencv-python>=4.9", "pyserial>=3.5", "torch>=2.2", "torchvision>=0.17", "Pillow>=10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
